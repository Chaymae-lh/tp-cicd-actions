name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:   # important pour l'étape 4

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # ← annule le job après 10 min
    concurrency:
      group: ci-${{ github.ref }}   # ← un seul run par branche
      cancel-in-progress: true      # ← annule l'ancien si nouveau push
    strategy:
      matrix:
        node-version: [18, 20, 22]   # teste sur 3 versions en parallèle
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'   # met en cache les dépendances pour aller plus vite

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le linting
        run: npm run lint

      - name: Lancer les tests avec couverture
        run: npm test

      - name: Upload du rapport de couverture
        if: matrix.node-version == 22   # upload une seule fois
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7